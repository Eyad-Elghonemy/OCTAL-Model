[project]
name = "vehicle-price-prediction"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]==0.139.0",
    "uvicorn==0.49.0",
    "scikit-learn==1.7.1",
    "pandas==2.2.3",
    "numpy==2.1.3",
    "joblib==1.4.2",
    "pydantic>=2.11.7,<3.0.0",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.32",
    "requests==2.32.3",
    "supabase==2.31.0",
]

[tool.setuptools]
py-modules = ["main"]
packages = ["utils"]
